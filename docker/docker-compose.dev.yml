services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    image: hlab-web:dev
    container_name: hlab-web-dev
    restart: unless-stopped
    environment:
      - VITE_BLOG_API_ENABLED=false
      - VITE_PORTFOLIO_METRICS_API_ENABLED=false
      - VITE_ADMIN_ENABLED=true
      - VITE_ADMIN_AUTH_BYPASS=true
    ports:
      - "3000:3000"
    volumes:
      - ..:/app
      - /app/node_modules
    networks:
      - hlab-network

networks:
  hlab-network:
    driver: bridge
