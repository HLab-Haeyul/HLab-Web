services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    image: hlab-web:dev
    container_name: hlab-web-dev
    restart: unless-stopped
    environment:
      - VITE_BLOG_API_ENABLED=false
    ports:
      - "3000:3000"
    volumes:
      - ..:/app
      - /app/node_modules
    networks:
      - hlab-network

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    image: hlab-web-api:dev
    container_name: hlab-web-api-dev
    restart: unless-stopped
    command: ["node", "--watch", "server/index.js"]
    ports:
      - "8080:8080"
    volumes:
      - ..:/app
    networks:
      - hlab-network

networks:
  hlab-network:
    driver: bridge
