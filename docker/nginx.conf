server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    default_type application/json;
    return 503 '{"message":"API backend is not configured for this deployment."}';
  }

  # Serve static files if present, otherwise hand off to Vue router.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
