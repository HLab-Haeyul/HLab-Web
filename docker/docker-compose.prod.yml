services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.prod
    image: hlab-web:prod
    container_name: hlab-web-prod
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:80"
    networks:
      - hlab-network

networks:
  hlab-network:
    driver: bridge
